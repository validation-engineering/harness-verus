[package]
name = "cordis-harness-dynamic-text-analysis"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
cordis-plugin-api = { path = "../../../cordis-verus/crates/cordis-plugin-api", version = "=0.2.0" }
serde_json = "1"

[[example]]
name = "dynamic_text_v1"
crate-type = ["cdylib"]

[[example]]
name = "dynamic_text_v2"
crate-type = ["cdylib"]

[[example]]
name = "dynamic_text_fail"
crate-type = ["cdylib"]

# Optimized machine code retains overflow and debug assertions.
[profile.release]
debug-assertions = true
overflow-checks = true
