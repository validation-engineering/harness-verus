[package]
name = "cordis-harness-text-analysis"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cordis-node = { path = "../../../cordis-verus/crates/cordis-node", version = "=0.1.0" }
napi = { version = "=3.14.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.10"
serde_json = "1"

[build-dependencies]
napi-build = "=2.6.0"

[lints.rust]
unsafe_code = "deny"
